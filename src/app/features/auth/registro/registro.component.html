<form #f="ngForm" class="formulario" novalidate (ngSubmit)="enviar(f)">
  <div>
    <label>
      Nombre de usuario
      <input
        name="nombre"
        type="text"
        autocomplete="username"
        maxlength="50"
        required
        [(ngModel)]="datos.nombre"
        (ngModelChange)="limpiarErrorApi('nombre')"
        #nombre="ngModel"
        [class.invalido]="errorDe('nombre', nombre, f.submitted)"
      />
    </label>
    @if (errorDe('nombre', nombre, f.submitted); as mensaje) {
      <p class="error" role="alert">{{ mensaje }}</p>
    }
  </div>

  <div>
    <label>
      Email
      <input
        name="email"
        type="email"
        autocomplete="email"
        maxlength="100"
        required
        email
        [(ngModel)]="datos.email"
        (ngModelChange)="limpiarErrorApi('email')"
        #email="ngModel"
        [class.invalido]="errorDe('email', email, f.submitted)"
      />
    </label>
    @if (errorDe('email', email, f.submitted); as mensaje) {
      <p class="error" role="alert">{{ mensaje }}</p>
    }
  </div>

  <div>
    <label>
      Contraseña (8 a 20 caracteres)
      <input
        name="password"
        type="password"
        autocomplete="new-password"
        minlength="8"
        maxlength="20"
        required
        [(ngModel)]="datos.password"
        (ngModelChange)="limpiarErrorApi('password')"
        #password="ngModel"
        [class.invalido]="errorDe('password', password, f.submitted)"
      />
    </label>
    @if (errorDe('password', password, f.submitted); as mensaje) {
      <p class="error" role="alert">{{ mensaje }}</p>
    }
  </div>

  @if (errorGeneral(); as mensaje) {
    <p class="error general" role="alert">{{ mensaje }}</p>
  }

  <button class="btn" type="submit" [disabled]="enviando()">
    {{ enviando() ? 'Creando cuenta...' : 'Crear cuenta' }}
  </button>
</form>
